<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <!-- Shows one SVG or website image so the game can use it as an icon -->
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
        img { display: block; width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <img id="icon" alt="">
    <script>
        const src = new URLSearchParams(location.search).get('src');
        if (src) document.getElementById('icon').src = src;
    </script>
</body>
</html>
